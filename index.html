<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dota 2 Leaderboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { --bg:#0f1115; --panel:rgba(24,27,34,.82); --line:#262a34; --text:#e6e8ee; --muted:#8b91a0; --accent:#e5533d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }

  /* Фон: картинка bg.jpg из корня проекта + затемнение поверх, чтобы текст читался.
     Если файла bg.jpg нет — останется тёмный градиент. */
  body::before {
    content:""; position:fixed; inset:0; z-index:-1;
    background:
      linear-gradient(rgba(15,17,21,.78), rgba(15,17,21,.94)),
      url("bg.png") center / cover no-repeat,
      radial-gradient(1200px 600px at 50% -10%, #3a1a16 0%, var(--bg) 60%);
  }

  /* Анимации */
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  main > * { animation: fadeUp .5s ease both; }            /* блоки страницы появляются по очереди */
  main > :nth-child(2) { animation-delay:.05s; }
  main > :nth-child(3) { animation-delay:.10s; }
  main > :nth-child(4) { animation-delay:.15s; }
  main > :nth-child(5) { animation-delay:.20s; }
  main > :nth-child(6) { animation-delay:.25s; }
  tr.in { animation: fadeUp .35s ease both; }              /* строки таблицы «выезжают» при смене фильтра */
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: rgba(255,255,255,.05); }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

  main { max-width:820px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
  .langs { margin:0; }
  .langs button { padding:5px 10px; font-size:13px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:13px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .tabs button { background:var(--panel); color:var(--text); border:1px solid var(--line); padding:8px 14px; border-radius:8px; cursor:pointer; font:inherit;
    transition: transform .15s, background .2s, border-color .2s, box-shadow .2s; }
  .tabs button:hover { transform:translateY(-2px); border-color:var(--accent); }
  .tabs button:active { transform:translateY(0) scale(.96); }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 6px 18px rgba(229,83,61,.35); }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  select, input { background:var(--panel); color:var(--text); border:1px solid var(--line); padding:9px 12px; border-radius:8px; font:inherit; min-width:0;
    transition: border-color .2s, box-shadow .2s; }
  select:focus, input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(229,83,61,.25); }
  select { flex:1 1 220px; } input { flex:2 1 220px; }
  .stat { color:var(--muted); font-size:13px; margin-bottom:8px; min-height:20px; }
  .stat b { color:var(--text); }
  table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:10px; overflow:hidden; }
  th, td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  td.rank { width:70px; color:var(--muted); font-variant-numeric:tabular-nums; }
  td.country { width:150px; color:var(--muted); white-space:nowrap; }
  td.name { word-break:break-word; }
  .tag { color:var(--accent); margin-right:6px; }
  img.flag { width:20px; height:15px; vertical-align:-2px; margin-right:6px; border-radius:2px; }
  tr:last-child td { border-bottom:0; }
  .msg { padding:28px; text-align:center; color:var(--muted); }
  @media (max-width:520px) { td.country span { display:none; } td.country { width:44px; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 data-i18n="title"></h1>
    <div class="tabs langs" id="langs">
      <button data-lang="en">EN</button>
      <button data-lang="cs">CZ</button>
      <button data-lang="ru">RU</button>
    </div>
  </div>
  <p class="sub" data-i18n="sub"></p>

  <div class="tabs" id="tabs"></div>
  <div class="controls">
    <select id="country"></select>
    <input id="search" type="search">
  </div>
  <div class="stat" id="stat"></div>

  <table>
    <thead><tr><th data-i18n="rank"></th><th data-i18n="player"></th><th data-i18n="country"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<script>
// ---------- Переводы ----------
const T = {
  en: { title: 'Dota 2 Leaderboard', sub: 'Filter by country. Only players who set their country have a flag.',
        search: 'Search by nickname or team tag', rank: 'Rank', player: 'Player', country: 'Country',
        loading: 'Loading…', all: 'All countries', noflag: 'No flag', shown: 'Showing {n} of {m}',
        none: 'No players found', error: 'Failed to load data: ',
        europe: 'Europe', americas: 'Americas', se_asia: 'SE Asia', china: 'China' },
  cs: { title: 'Dota 2 — žebříček', sub: 'Filtr podle země. Vlajku mají jen hráči, kteří si zemi sami nastavili.',
        search: 'Hledat podle přezdívky nebo tagu týmu', rank: 'Pořadí', player: 'Hráč', country: 'Země',
        loading: 'Načítání…', all: 'Všechny země', noflag: 'Bez vlajky', shown: 'Zobrazeno {n} z {m}',
        none: 'Nikdo nenalezen', error: 'Nepodařilo se načíst data: ',
        europe: 'Evropa', americas: 'Amerika', se_asia: 'JV Asie', china: 'Čína' },
  ru: { title: 'Dota 2 — лидерборд', sub: 'Фильтр по стране. Флаг есть только у игроков, которые указали страну сами.',
        search: 'Поиск по нику или тегу команды', rank: 'Ранг', player: 'Игрок', country: 'Страна',
        loading: 'Загрузка…', all: 'Все страны', noflag: 'Без флага', shown: 'Показано {n} из {m}',
        none: 'Никого не найдено', error: 'Не удалось загрузить данные: ',
        europe: 'Европа', americas: 'Америка', se_asia: 'ЮВА', china: 'Китай' },
};
const DIVISIONS = ['europe', 'americas', 'se_asia', 'china'];
const $ = id => document.getElementById(id);

// Язык по умолчанию — английский; если человек уже выбирал другой, берём сохранённый
let lang = 'en';
try { const saved = localStorage.getItem('lang'); if (T[saved]) lang = saved; } catch {}
let names;                                  // переводчик кодов стран: 'kz' -> 'Kazakhstan'
const t = key => T[lang][key];              // t('rank') -> текст на текущем языке

let players = [];          // игроки текущего региона
let division = 'europe';
let country = 'kz';        // стартовый фильтр — Казахстан
let state = 'loading';     // loading | ok | текст ошибки

function countryName(code) {
  if (!code) return t('noflag');
  try { return names.of(code.toUpperCase()); } catch { return code.toUpperCase(); }
}

function message(text) {
  $('rows').innerHTML = '<tr><td colspan="3" class="msg"></td></tr>';
  $('rows').firstChild.firstChild.textContent = text;
}

// Кнопки регионов
for (const key of DIVISIONS) {
  const b = document.createElement('button');
  b.dataset.key = key;
  b.onclick = () => load(key);
  $('tabs').append(b);
}

// Переключение языка: подставляем все тексты заново
function setLang(l) {
  lang = l;
  try { localStorage.setItem('lang', l); } catch {}
  document.documentElement.lang = l;
  document.title = t('title');
  names = new Intl.DisplayNames([l], { type: 'region' });
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const b of $('tabs').children) b.textContent = t(b.dataset.key);
  for (const b of $('langs').children) b.classList.toggle('on', b.dataset.lang === l);
  $('search').placeholder = t('search');
  $('country').setAttribute('aria-label', t('country'));
  if (state === 'ok') { fillCountries(); render(); }
  else if (state === 'loading') message(t('loading'));
  else message(t('error') + state);
}
for (const b of $('langs').children) b.onclick = () => setLang(b.dataset.lang);

async function load(key) {
  division = key;
  for (const b of $('tabs').children) b.classList.toggle('on', b.dataset.key === key);
  state = 'loading';
  message(t('loading'));
  try {
    const res = await fetch('/api/leaderboard?division=' + key);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    players = (data.leaderboard || []).map(p => ({ ...p, country: (p.country || '').toLowerCase() }));
    state = 'ok';
    fillCountries();
    render();
  } catch (e) {
    state = e.message;
    $('stat').textContent = '';
    message(t('error') + state);
  }
}

// Список стран с количеством игроков, по убыванию
function fillCountries() {
  const counts = {};
  for (const p of players) counts[p.country] = (counts[p.country] || 0) + 1;
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  const sel = $('country');
  sel.innerHTML = '';
  sel.add(new Option(`${t('all')} (${players.length})`, '*'));
  for (const [code, n] of sorted) sel.add(new Option(`${countryName(code)} (${n})`, code));
  if (![...sel.options].some(o => o.value === country)) country = '*';
  sel.value = country;
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const list = players.filter(p =>
    (country === '*' || p.country === country) &&
    (!q || (p.name || '').toLowerCase().includes(q) || (p.team_tag || '').toLowerCase().includes(q))
  );

  $('stat').innerHTML = t('shown').replace('{n}', `<b>${list.length}</b>`).replace('{m}', players.length);

  const frag = document.createDocumentFragment();
  let i = 0;
  for (const p of list) {
    const tr = document.createElement('tr');
    // Анимируем только первые 40 строк — остальные всё равно за экраном
    if (i < 40) { tr.className = 'in'; tr.style.animationDelay = i * 15 + 'ms'; }
    i++;

    const rank = tr.insertCell(); rank.className = 'rank'; rank.textContent = p.rank;

    const name = tr.insertCell(); name.className = 'name';
    if (p.team_tag) {
      const tag = document.createElement('span');
      tag.className = 'tag'; tag.textContent = p.team_tag;
      name.append(tag);
    }
    name.append(p.name || '—');            // textContent/append — ник вставляется как текст, не как HTML

    const c = tr.insertCell(); c.className = 'country';
    if (p.country) {
      const img = document.createElement('img');
      img.className = 'flag'; img.loading = 'lazy'; img.alt = p.country.toUpperCase();
      img.src = `https://flagcdn.com/40x30/${p.country}.png`;
      const label = document.createElement('span'); label.textContent = countryName(p.country);
      c.append(img, label);
    }
    frag.append(tr);
  }

  $('rows').innerHTML = '';
  if (list.length) $('rows').append(frag);
  else message(t('none'));
}

$('country').onchange = e => { country = e.target.value; render(); };
$('search').oninput = render;

setLang(lang);      // сначала тексты на нужном языке
load(division);     // потом данные
</script>
</body>
</html>
